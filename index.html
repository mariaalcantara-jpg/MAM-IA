<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151126"><meta name="description" content="Conoce MAM, tu espacio para crear, preguntar y descubrir."><title>MAM · Tu espacio para imaginar</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23ff7187%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23a985f4%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2218%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2239%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2219%22%20font-weight%3D%22900%22%20text-anchor%3D%22middle%22%20fill%3D%22%23291630%22%3EMAM%3C%2Ftext%3E%3C%2Fsvg%3E">

<style>
:root{color-scheme:dark;--bg:#100e1a;--panel:#191526;--border:#342b47;--text:#f8f5ff;--muted:#b7acc8;--pink:#ff9bd3;--purple:#b99bff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 12% 0%,#782b45 0,transparent 42%),radial-gradient(ellipse at 90% 12%,#533176 0,transparent 38%),#100d1a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text)}button,textarea{font:inherit}.app{height:100dvh;max-width:1030px;margin:auto;display:flex;flex-direction:column;padding:16px 24px max(12px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 14px;border-bottom:1px solid #ffffff15}.brand{display:flex;gap:12px;align-items:center}.logo,.bot-avatar{background:linear-gradient(145deg,#ff7187,#ad84ed);color:#261735;display:grid;place-items:center;font-weight:900}.logo{width:45px;height:45px;border-radius:16px;font-size:23px;box-shadow:0 6px 28px #e69dff38}.logo{font-size:13px;letter-spacing:-.05em}.bot-avatar{font-size:10px;letter-spacing:-.05em}.star{font-size:19px;font-weight:900;letter-spacing:.04em}.brand-title{font-size:21px;font-weight:850;letter-spacing:.10em}.brand-sub{font-size:12px;color:var(--muted)}.new{border:1px solid #51445f;background:#ffffff0c;color:#eee4f8;border-radius:13px;padding:10px 14px;cursor:pointer}.new:hover{background:#ffffff17}.chat{flex:1;overflow-y:auto;scroll-behavior:smooth;padding:20px 3px}.welcome{text-align:center;max-width:700px;margin:clamp(15px,5vh,55px) auto 30px}.star{margin:auto;width:78px;height:78px;border:1px solid #f8c4f18a;border-radius:27px;background:linear-gradient(145deg,#ff7489,#a88aff);box-shadow:0 14px 55px #c19cff44;color:#321a3e;display:grid;place-items:center;font-size:38px}.hello{display:inline-block;margin-top:24px;color:#f5b7df;font-size:12px;font-weight:800;letter-spacing:.18em}.welcome h1{font-size:clamp(30px,6vw,48px);line-height:1.13;letter-spacing:-.035em;margin:10px 0}.welcome h1 span{background:linear-gradient(100deg,#ff8d9b,#c2a8ff);background-clip:text;-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);max-width:530px;margin:12px auto 24px}.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}.suggestion{border:1px solid #594b68;background:#ffffff0b;border-radius:16px;padding:14px;color:#eee8f9;text-align:left;cursor:pointer;transition:.2s}.suggestion:hover{transform:translateY(-2px);border-color:#d69dd1;background:#ffffff10}.suggestion b{display:block;font-size:14px;margin:6px 0 2px}.suggestion small{color:var(--muted);font-size:12px}.message{max-width:770px;display:flex;gap:10px;align-items:flex-start;margin:18px auto}.message.user{flex-direction:row-reverse}.bot-avatar,.user-avatar{width:34px;height:34px;border-radius:12px;flex:0 0 auto}.user-avatar{display:grid;place-items:center;background:#51446d;color:#f6eafe;font-weight:700}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:13px 16px;border:1px solid #3f354f;background:#221c31;border-radius:4px 18px 18px 18px;max-width:85%;font-size:15px;line-height:1.6}.user .bubble{background:#50375e;border:1px solid #745175;border-radius:18px 4px 18px 18px}.status{max-width:770px;width:100%;margin:0 auto 8px;color:#c2b8d0;min-height:18px;font-size:12px}.status.error{color:#ffb5c4}.composer{display:flex;gap:9px;max-width:770px;width:100%;margin:0 auto;background:#211a2d;border:1px solid #59475e;border-radius:19px;padding:8px;box-shadow:0 8px 40px #0003}.composer:focus-within{border-color:#dd9dcc}textarea{display:block;width:100%;height:46px;max-height:120px;resize:none;background:transparent;color:white;border:0;outline:0;padding:10px 12px}textarea::placeholder{color:#b2a3bc}.send{border:0;border-radius:13px;background:linear-gradient(115deg,#ff7a90,#ac91fa);color:#27162d;font-weight:800;padding:0 18px;cursor:pointer}.send:disabled,.new:disabled{opacity:.55;cursor:wait}.foot{max-width:770px;margin:9px auto 0;text-align:center;color:#9e91ac;font-size:11px}.foot b{color:#e2b8dc}.hidden{display:none}@media(max-width:600px){.app{padding:12px 13px max(10px,env(safe-area-inset-bottom))}.logo{width:40px;height:40px}.brand-title{font-size:18px}.new{font-size:13px;padding:8px 10px}.welcome{margin-top:15px}.star{width:60px;height:60px;font-size:16px;border-radius:21px}.hello{margin-top:16px}.welcome h1{font-size:30px}.welcome p{font-size:14px;margin-bottom:17px}.suggestions{grid-template-columns:1fr;gap:7px}.suggestion{padding:9px 12px}.suggestion b{display:inline;margin:0 0 0 7px}.suggestion small{display:none}.chat{padding-top:12px}.send{padding:0 13px}}

.menu{width:43px;height:43px;border:1px solid #63465d;background:#ffffff10;color:#fff;border-radius:13px;font-size:21px;cursor:pointer;flex-shrink:0}.head-left{display:flex;gap:12px;align-items:center}.veil{position:fixed;inset:0;background:#07040bc4;z-index:4}.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);z-index:5;background:#201529;border-right:1px solid #62415e;box-shadow:12px 0 55px #0008;display:flex;flex-direction:column;padding:20px}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:0;font-size:20px}.drawer-close{background:#ffffff12;color:#fff;border:0;border-radius:10px;padding:8px 13px;cursor:pointer}.drawer-new{margin:20px 0 12px;padding:13px;background:linear-gradient(110deg,#ff788d,#ab8bf0);color:#281126;font-weight:800;border:0;border-radius:13px;cursor:pointer}.drawer-note{color:#c7b3ca;font-size:12px;margin:0 0 12px}.chat-list{overflow-y:auto;display:flex;flex-direction:column;gap:7px}.history-row{display:flex;gap:5px;border:1px solid transparent;border-radius:12px;background:#ffffff0b}.history-row.active{background:#75496a55;border-color:#9e6d95}.history-open{background:transparent;color:white;border:0;text-align:left;padding:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history-delete{background:transparent;border:0;color:#ffb1b9;padding:8px 12px;cursor:pointer}.empty-list{color:#c7b3ca;font-size:13px}.hidden{display:none!important}
</style></head><body>
<main class="app"><header><div class="head-left"><button type="button" class="menu" id="open-menu" aria-label="Abrir chats" aria-expanded="false">☰</button><div class="brand"><div class="logo" aria-label="Logo de MAM">MAM</div><div><div class="brand-title">MAM</div><div class="brand-sub">Un espacio para imaginar ✨</div></div></div></div><button class="new" id="clear" type="button">＋ Nuevo chat</button></header>
<div id="veil" class="veil hidden"></div><aside class="drawer hidden" id="drawer" aria-label="Chats guardados"><div class="drawer-head"><h2>💬 Tus chats</h2><button class="drawer-close" type="button" id="close-menu" aria-label="Cerrar menú">✕</button></div><button class="drawer-new" id="drawer-new" type="button">＋ Iniciar nuevo chat</button><p class="drawer-note">Se guardan solo en este navegador y dispositivo.</p><div class="chat-list" id="chat-list"></div></aside>
<section class="chat" id="chat" aria-live="polite"><div class="welcome" id="welcome"><div class="star" aria-label="Logo de MAM">MAM</div><span class="hello">HOLA, SOY MAM</span><h1>¿Qué vamos a <span>crear hoy?</span></h1><p>Estoy aquí para acompañarte con tus ideas, dudas y curiosidades. ¡Empecemos a charlar!</p><div class="suggestions"><button class="suggestion" type="button" data-prompt="Dame tres ideas divertidas para un día en casa.">💡 <b>Dame ideas</b><small>Un poco de inspiración</small></button><button class="suggestion" type="button" data-prompt="Explícame algo curioso del universo de forma sencilla.">🌙 <b>Cuéntame algo</b><small>Descubre algo nuevo</small></button><button class="suggestion" type="button" data-prompt="Ayúdame a escribir una historia corta y divertida.">✍️ <b>Vamos a crear</b><small>Imaginemos juntas</small></button></div></div></section>
<div class="status" id="status" role="status"></div><form class="composer" id="form"><textarea id="input" aria-label="Tu mensaje para MAM" placeholder="Escribe algo a MAM…" rows="1" maxlength="4000" required></textarea><button class="send" id="send" type="submit">Enviar ↑</button></form><div class="foot"><b>Created by Mery</b></div></main>
<script>
const chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),status=document.getElementById('status'),input=document.getElementById('input'),send=document.getElementById('send'),clear=document.getElementById('clear'),form=document.getElementById('form');
let history=[],busy=false, activeId=null, chats=[];const STORAGE_KEY='mam_mery_chats_v1';const drawer=document.getElementById('drawer'),veil=document.getElementById('veil'),menu=document.getElementById('open-menu'),chatList=document.getElementById('chat-list');
try {const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(saved))chats=saved.filter(c=>c&&typeof c.id==='string'&&Array.isArray(c.messages));}catch(e){status.textContent='No se han podido recuperar los chats guardados.'}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chats))}catch(e){status.className='status error';status.textContent='No se ha podido guardar el chat en este navegador.'}}
function drawerOpen(open){drawer.classList.toggle('hidden',!open);veil.classList.toggle('hidden',!open);menu.setAttribute('aria-expanded',String(open));if(open)renderList()}
function renderList(){chatList.replaceChildren();if(!chats.length){let empty=document.createElement('p');empty.className='empty-list';empty.textContent='Todavía no tienes chats guardados.';chatList.append(empty);return}for(const item of [...chats].reverse()){const row=document.createElement('div');row.className='history-row'+(item.id===activeId?' active':'');let open=document.createElement('button');open.type='button';open.className='history-open';open.textContent='💬 '+(item.title||'Nuevo chat');open.title=item.title||'Nuevo chat';open.addEventListener('click',()=>{if(busy)return;activeId=item.id;history=item.messages.slice();paintHistory();drawerOpen(false)});let del=document.createElement('button');del.type='button';del.className='history-delete';del.textContent='🗑';del.setAttribute('aria-label','Borrar chat '+(item.title||''));del.addEventListener('click',()=>{if(busy)return;if(!confirm('¿Borrar este chat? No se podrá recuperar.'))return;chats=chats.filter(x=>x.id!==item.id);if(activeId===item.id){activeId=null;history=[];paintHistory()}persist();renderList()});row.append(open,del);chatList.append(row)}}
function paintHistory(){chat.querySelectorAll('.message').forEach(node=>node.remove());welcome.classList.toggle('hidden',history.length>0);history.forEach(m=>addMessage(m.role,m.content));status.className='status';status.textContent=''}
function saveHistory(){if(!activeId){activeId='chat-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);chats.push({id:activeId,title:(history.find(m=>m.role==='user')?.content||'Nuevo chat').slice(0,45),messages:[]})}const c=chats.find(x=>x.id===activeId);if(c)c.messages=history.slice();persist();renderList()}
function newChat(){if(busy)return;activeId=null;history=[];paintHistory();drawerOpen(false);input.value='';input.focus()}
menu.addEventListener('click',()=>drawerOpen(true));document.getElementById('close-menu').addEventListener('click',()=>drawerOpen(false));veil.addEventListener('click',()=>drawerOpen(false));document.getElementById('drawer-new').addEventListener('click',newChat);document.addEventListener('keydown',e=>{if(e.key==='Escape')drawerOpen(false)});
function addMessage(role,text){welcome.classList.add('hidden');const msg=document.createElement('div');msg.className='message '+role;const avatar=document.createElement('div');avatar.className=role==='user'?'user-avatar':'bot-avatar';avatar.textContent=role==='user'?'T':'MAM';const content=document.createElement('div');content.className='bubble';content.textContent=text;msg.append(avatar,content);chat.append(msg);chat.scrollTop=chat.scrollHeight;return content}
function setBusy(value){busy=value;input.disabled=value;send.disabled=value;clear.disabled=value;document.querySelectorAll('.suggestion').forEach(x=>x.disabled=value)}
function readableResponse(response){const content=response?.message?.content;if(typeof content==='string')return content;if(Array.isArray(content))return content.map(x=>x.text||'').join('');if(typeof response==='string')return response;return ''}
form.addEventListener('submit',async event=>{event.preventDefault();const text=input.value.trim();if(!text||busy)return;input.value='';addMessage('user',text);setBusy(true);status.className='status';status.textContent='MAM está pensando…';try{const messages=[...history.slice(-10),{role:'user',content:text}];const response=await fetch('https://chat-ia-dmf.diego-martinez-3b0.workers.dev/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const data=await response.json();if(!response.ok||!data.reply)throw new Error(data.error||'El servicio no devolvió una respuesta.');const answer=data.reply;history.push({role:'user',content:text},{role:'assistant',content:answer});addMessage('assistant',answer);saveHistory();status.textContent=''}catch(error){const code=error?.code||'';let message='No he podido responder. Revisa la conexión o inténtalo de nuevo.';if(code==='insufficient_funds')message='Se ha agotado el límite del servicio de IA.';else if(code==='too_many_requests')message='Hay demasiadas peticiones. Espera un momento y vuelve a intentarlo.';else if(error?.message)message+=' Detalle: '+error.message;addMessage('assistant',message);status.className='status error';status.textContent='No se ha recibido respuesta; el mensaje no se ha añadido al historial.'}finally{setBusy(false);input.focus()}});
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});clear.addEventListener('click',newChat);document.querySelectorAll('.suggestion').forEach(button=>button.addEventListener('click',()=>{input.value=button.dataset.prompt;form.requestSubmit()}));
</script></body></html>
